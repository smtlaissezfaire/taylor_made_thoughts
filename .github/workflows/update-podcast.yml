name: Update podcast episodes

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-podcast
  cancel-in-progress: false

jobs:
  update-episodes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch RSS feed and generate episodes.json
        run: node scripts/fetch-podcast.js

      - name: Commit updated episodes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.json sitemap.xml episodes
          if git diff --staged --quiet; then
            echo "No episode changes to commit."
            exit 0
          fi
          git commit -m "Update podcast episodes from RSS feed"
          git push
